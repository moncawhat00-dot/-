<style>

}

   이 값들은 일반적인 영양 상식으로 정리한 대략값이며 공식 DB와 대조하기 전이라 '검토 대기' 상태입니다. */
const SEED_DATE = '2026-10-30';
const FOOD_RAW = `
시금치|Spinach|채소|섬초;포항초|23,3.6,2.9,0.4,79|ggggg|칼륨, 식이섬유, 엽산이 풍부해요. 데쳐서 한 접시(70g 안팎)가 알맞아요. 신장 질환으로 칼륨 제한이 있으면 의료진과 상의하세요.

const CH_L = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const CH_V = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const CH_T = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function jamo(s) { let o = ''; for (const ch of s) { const c = ch.charCodeAt(0) - 0xAC00; o += (c >= 0 && c < 11172) ? CH_L[Math.floor(c / 588)] + CH_V[Math.floor(c % 588 / 28)] + CH_T[c % 28] : ch; } return o; }
function initials(s) { let o = ''; for (const ch of s) { const c = ch.charCodeAt(0) - 0xAC00; o += (c >= 0 && c < 11172) ? CH_L[Math.floor(c / 588)] : ch; } return o; }
const norm = s => String(s || '').toLowerCase().replace(/\s+/g, '');
function lev(a, b) {
  if (a === b) return 0; if (!a.length) return b.length; if (!b.length) return a.length;
  let prev = Array.from({length: b.length + 1}, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
function matchScore(it, q) {
  const nq = norm(q); if (!nq) return 1;
  const names = [it.name, ...(it.aliases || []), it.en || ''].map(norm).filter(Boolean);
  let best = 0;
  for (const n of names) {
    if (n === nq) best = Math.max(best, 100); else if (n.startsWith(nq)) best = Math.max(best, 80); else if (n.includes(nq)) best = Math.max(best, 60);
  }
  if (best) return best;
  if (/^[ㄱ-ㅎ]+$/.test(nq)) { for (const n of names) if (initials(n).includes(nq)) return 50; return 0; }
  const jq = jamo(nq); if (jq.length < 3) return 0;
  const th = jq.length >= 7 ? 2 : 1;
  for (const n of names) {
    const jn = jamo(n);
    if (jn.includes(jq)) return 55;
    const d = lev(jn, jq); if (d <= th) best = Math.max(best, 30 - d);
    if (jn.length > jq.length) { const d2 = lev(jn.slice(0, jq.length), jq); if (d2 <= th) best = Math.max(best, 28 - d2); }
  }
  return best;
}

  if (d) { try { await d.save({filename, data}); toast('파일을 저장했어요'); } catch (e) { if (!e || e.code !== 'declined') toast('파일을 저장하지 못했어요'); } return; }

}

const modals = [];
function openModal(html) {

  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  bg._prev = document.activeElement;
  document.body.appendChild(bg); modals.push(bg); document.body.style.overflow = 'hidden';
  bg.addEventListener('mousedown', e => { if (e.target === bg) closeModal(bg); });

}
function fileToDataURL(file, max = 1000, q = 0.72) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const img = new Image(); img.onerror = rej;
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q));

  });
}

/* ===== 사이트에 기록 저장 (같은 사이트를 여는 모든 기기가 같은 기록을 봐요) =====
   저장 단위: diary/core, diary/days-YYYY-MM, items/*, recipes/*, meals/*, photos/*
   문서 하나는 256KiB 이하여야 해서 사진은 한 장씩 따로 저장해요. */
const photoIdCache = new Map();

  const byMonth = {};
  Object.keys(S.days).forEach(d => { (byMonth[d.slice(0, 7)] = byMonth[d.slice(0, 7)] || {})[d] = S.days[d]; });
  Object.keys(byMonth).forEach(ym => m.set('diary/days-' + ym, {days: byMonth[ym]}));
  S.foods.concat(S.spices).forEach(it => m.set('items/' + it.id, {item: it}));
  S.recipes.forEach(r => m.set('recipes/' + r.id, {recipe: r}));
  S.meals.forEach(me => {
    const ids = (me.photos || []).map(p => { const id = photoId(p); m.set('photos/' + id, {d: p}); return id; });

  const core = c.diary.get('core');

}
const sync = {
  mode: 'local', db: null, cols: {diary: new Map(), items: new Map(), recipes: new Map(), meals: new Map(), photos: new Map()},

  async init(hasLocal) {

      const hasRemote = this.cols.diary.has('core');

  sub(name) {

  },
  onRemote(name) {

    } catch (e) {

<script>
(() => {
  const endpoint = "https://health-ai-helper.moncawhat00.workers.dev";
  const form = document.getElementById("health-ai-form");
  const input = document.getElementById("health-ai-input");
  const messages = document.getElementById("health-ai-messages");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    const userMessage = document.createElement("div");
    userMessage.className = "health-ai-msg";
    userMessage.textContent = "🙋 " + question;
    messages.appendChild(userMessage);

    const answerMessage = document.createElement("div");

    try {
      const response = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: question })
      });
      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "서버 응답 오류");
      }

      answerMessage.textContent = "🤖 " + (data.answer || "답변이 비어 있어요.");
    } catch (error) {
      answerMessage.textContent =
        "⚠️ 연결에 실패했어요. 잠시 후 다시 시도해 주세요.";
    }

    messages.scrollTop = messages.scrollHeight;
  });
})();

<script>
(async function () {
  const endpoint =
    "https://health-ai-helper.moncawhat00.workers.dev/?foods=1";

  try {
    const response = await fetch(endpoint);
    if (!response.ok) throw new Error("식재료를 불러오지 못했어요.");

    const data = await response.json();
    const foods = data.foods || [];

    if (!foods.length) return;

    // 식재료 영역에서 표시할 위치 찾기
    const headings = [...document.querySelectorAll("h1,h2,h3,h4")]
      .filter(el => el.textContent.includes("식재료"));

    if (!headings.length) {
      console.log("식재료 제목을 찾지 못했어요.", foods);
      return;
    }

    const section = headings[0].closest("section, article, .card") ||
                    headings[0].parentElement;

    const list = document.createElement("div");
    list.style.cssText =
      "display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:16px 0;";

    foods.forEach(food => {
      const card = document.createElement("div");
      card.style.cssText =
        "padding:16px;border:1px solid #d9e8d5;border-radius:16px;background:#f7fbf5;color:#304b35;";

      const name = document.createElement("h3");
      name.textContent = food.name || food.ingredient || "식재료";
      name.style.marginTop = "0";

      const detail = document.createElement("p");
      detail.textContent =
        food.summary || food.reason || food.description ||
        food.answer || "저장된 식재료 정보";

      card.append(name, detail);
      list.appendChild(card);
    });

    section.appendChild(list);
  } catch (error) {
    console.error("식재료 표시 오류:", error);
  }
})();
</script>
</body></html>
